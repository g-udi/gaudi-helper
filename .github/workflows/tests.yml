name: tests

# Runs on every pull request, in the merge queue, and on every push to main.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in progress
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to a commit, with the release it belongs to in a comment:
# a tag such as v4 can be moved to different code, a commit cannot.

jobs:
  suite:
    name: ./test/test.sh (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 rather than ubuntu-latest: pinned so the image does not change under the tests
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: gaudi-helper
      # Gaudi sits next to the helper, where the tests look for it: the files
      # the helper writes are validated with `gaudi check`, which keeps the
      # two projects agreeing on Brewfile and list formats. In CI the suite
      # fails when that checkout is missing.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: g-udi/gaudi
          path: gaudi
      - name: Install ShellCheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: Install ShellCheck and Zsh (Linux)
        if: runner.os == 'Linux'
        run: |
          # Install only what the runner image lacks, and retry: the package mirrors
          # fail to resolve now and then.
          missing=""
          for tool in shellcheck zsh; do command -v "$tool" > /dev/null 2>&1 || missing="$missing $tool"; done
          [ -n "$missing" ] || exit 0
          for attempt in 1 2 3 4 5; do
            # shellcheck disable=SC2086
            sudo apt-get update && sudo apt-get install -y $missing && break
            if [ "$attempt" = 5 ]; then exit 1; fi
            echo "apt failed (attempt $attempt), retrying in 20 seconds"; sleep 20
          done
      - name: Run the suite
        working-directory: gaudi-helper
        run: ./test/test.sh
